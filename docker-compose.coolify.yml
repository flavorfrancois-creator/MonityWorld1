services:
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-monity_world}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - monity-network

  whatsapp:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      WHATSAPP_PORT: 8002
    volumes:
      - whatsapp_sessions:/app/.wa_sessions
    networks:
      - monity-network
    shm_size: "2gb"
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: ${DB_NAME:-monity_world}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      WHATSAPP_SERVICE_URL: http://whatsapp:8002
    depends_on:
      mongodb:
        condition: service_healthy
      whatsapp:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - monity-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_PROXY_URL: http://backend:8001
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - monity-network

volumes:
  mongodb_data:
  backend_uploads:
  whatsapp_sessions:

networks:
  monity-network:
    driver: bridge
